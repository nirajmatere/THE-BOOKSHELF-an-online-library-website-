name: Documentor Pro
run-name: Documentor Pro - ${{ inputs.correlation_id }}
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Job ID from Documentor'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # Required if they want the bot to push commits back to the repo
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history, highly recommended for codebase analysis tools
          fetch-depth: 0
          # head_ref is set for pull_request events; ref_name is set for workflow_dispatch
          ref: ${{ github.head_ref || github.ref_name }}
          
      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Documentor Pro
        run: pip install documentor-pro --index-url https://${{ secrets.DOC_PRO_LICENSE }}:@witty-schools-take.loca.lt/pypi/simple/

      - name: Generate Docs (Full)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          echo "Starting full Documentor generation..."
          documentor generate .
          echo "Generation complete for job ${{ inputs.correlation_id }}"

      - name: Generate Docs (PR Changed Files)
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          echo "Starting PR Documentor generation..."
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ -f "$file" ]]; then
              echo "Regenerating docs for $file"
              documentor generate -f "$file" --regenerate || echo "Skipped $file"
            fi
          done
          
      - name: Commit and Push Docs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add documentor_docs/
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: Auto-update AI documentation [skip ci]"
          git push
          
      - name: Sync Embeddings to Documentor Pro
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          documentor sync . --api-url 'https://witty-schools-take.loca.lt' --correlation-id "${{ inputs.correlation_id }}"
